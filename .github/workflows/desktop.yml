name: Build Windows app

on:
  push:
    branches: [main, test]
    paths-ignore: ["android/**", ".github/workflows/android.yml", ".github/workflows/pages.yml", "README.md", "website/**", "mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Offline voice model (Vosk small English, ~40 MB)
        working-directory: desktop
        shell: bash
        run: mkdir -p model && curl -fsSL -o model/model.tar.gz https://raw.githubusercontent.com/ccoreilly/vosk-browser/gh-pages/models/vosk-model-small-en-us-0.15.tar.gz
      - name: Build installer
        working-directory: desktop
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npm run dist:win 2>&1 | tee build.log; test -f dist/Zuffi-Setup.exe
      - name: Rename
        shell: bash
        run: cp desktop/dist/Zuffi-Setup.exe Zuffi-Setup.exe && cp Zuffi-Setup.exe Sparrow-Setup.exe && ls -la Zuffi-Setup.exe
      - name: Publish test download (test branch)
        if: github.ref_name == 'test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-test
          name: Zuffi for Windows (test)
          prerelease: true
          make_latest: false
          files: Zuffi-Setup.exe
          body: |
            **Test Zuffi on Windows 10 / 11**
            1. Download `Zuffi-Setup.exe` below.
            2. Open it. If Windows shows "Windows protected your PC", click **More info → Run anyway** (Zuffi is free and not yet signed).
            3. Zuffi opens at the top of your screen 🐰 — press **Ctrl + Shift + Space** any time, or just say "Zuffi…".
      - name: Publish download (main)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Zuffi for Windows
          make_latest: false
          files: |
            Zuffi-Setup.exe
            Sparrow-Setup.exe
          body: |
            **Install Zuffi on Windows 10 / 11**
            1. Download `Zuffi-Setup.exe` below.
            2. Open it. If Windows shows "Windows protected your PC", click **More info → Run anyway** (Zuffi is free and not yet signed).
            3. Zuffi opens at the top of your screen 🐰 — press **Ctrl + Shift + Space** any time, or just say "Zuffi…".
      - name: Report build errors
        if: failure()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "Windows build failed at ${GITHUB_SHA::7}"; echo; echo '```'; tail -60 desktop/build.log 2>/dev/null || echo "see Actions log"; echo '```'; } > body.md
          gh label create build-errors --color B60205 -f >/dev/null 2>&1 || true
          N=$(gh issue list --label build-errors --state open --json number -q '.[0].number')
          if [ -z "$N" ]; then gh issue create --title "Build errors" --label build-errors --body-file body.md; else gh issue comment "$N" --body-file body.md; fi
