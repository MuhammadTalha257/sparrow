name: Build Android app

on:
  push:
    branches: [main, test]
    paths-ignore: ["desktop/**", "mac/**", ".github/workflows/desktop.yml", ".github/workflows/pages.yml", "README.md", "website/**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (pre-installed on GitHub runners)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Sparrow.apk
          cp Sparrow.apk Zuffi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zuffi-android
          path: Zuffi.apk

      - name: Publish test download (test branch)
        if: github.ref_name == 'test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Zuffi for Android (test)
          prerelease: true
          make_latest: false
          files: Zuffi.apk
          body: |
            **Test Zuffi on Android**
            1. Download `Zuffi.apk` below on your Android phone.
            2. Open it. If asked, allow "Install unknown apps" for your browser.
            3. Open Zuffi 🐰

      - name: Publish download (main)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Zuffi for Android
          make_latest: true
          files: Sparrow.apk
          body: |
            **Install Zuffi on Android**
            1. Download `Sparrow.apk` below on your Android phone.
            2. Open it. If asked, allow "Install unknown apps" for your browser.
            3. Open Zuffi 🐰
