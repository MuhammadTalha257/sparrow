name: Build Windows app

on:
  push:
    branches: [main]
    paths-ignore: ["mac/**", "android/**", ".github/workflows/mac.yml", ".github/workflows/android.yml", "README.md"]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: windows
        run: npm install --no-audit --no-fund

      - name: Offline voice model (Vosk small English, ~40 MB)
        working-directory: windows
        shell: bash
        run: |
          mkdir -p model
          curl -fsSL -o model/model.tar.gz https://raw.githubusercontent.com/ccoreilly/vosk-browser/gh-pages/models/vosk-model-small-en-us-0.15.tar.gz
          ls -la model

      - name: Build installer
        working-directory: windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist 2>&1 | tee build.log

      - name: Rename
        shell: bash
        run: cp windows/dist/Sparrow-Setup.exe Sparrow-Setup.exe && ls -la Sparrow-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Sparrow-windows
          path: Sparrow-Setup.exe

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Sparrow for Windows
          make_latest: false
          files: Sparrow-Setup.exe
          body: |
            **Install Sparrow on Windows 10 / 11**
            1. Download `Sparrow-Setup.exe` below.
            2. Open it. If Windows shows "Windows protected your PC", click **More info → Run anyway** (Sparrow is free and not yet signed).
            3. Sparrow opens and sits at the top of your screen 🐦 — press **Ctrl + Shift + Space** any time.

      - name: Report build errors as an issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Windows build failed at ${GITHUB_SHA::7}"; echo; echo '```'; tail -60 windows/build.log 2>/dev/null || echo "see Actions log"; echo '```'; } > body.md
          gh label create build-errors --color B60205 -f >/dev/null 2>&1 || true
          N=$(gh issue list --label build-errors --state open --json number -q '.[0].number')
          if [ -z "$N" ]; then gh issue create --title "Build errors" --label build-errors --body-file body.md; else gh issue comment "$N" --body-file body.md; fi
