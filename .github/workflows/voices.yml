name: Build offline voices

# Converts Meta's MMS text-to-speech voices (Urdu, Roman Urdu, Hindi, Punjabi) to small ONNX files
# that Sparrow downloads once and then speaks with offline.
on:
  push:
    paths: ["voices/**", ".github/workflows/voices.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Get the converter
        run: |
          fail() { tail -9 "$1" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          git clone --depth 1 --branch 3.0.2 https://github.com/huggingface/transformers.js tjs > git.log 2>&1 || fail git.log
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu > pip.log 2>&1 || fail pip.log
          grep -v -e nvidia -e graphsurgeon tjs/scripts/requirements.txt > req.txt
          pip install -r req.txt "numpy<2" onnx-graphsurgeon >> pip.log 2>&1 || fail pip.log
      - name: Convert voices
        run: |
          mkdir -p out
          while read -r name repo; do
            [ -z "$name" ] && continue
            echo "== $name ($repo)"
            (cd tjs && python -m scripts.convert --quantize --skip_validation --model_id "$repo") > conv.log 2>&1 || { tail -7 conv.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
            d="tjs/models/$repo"
            ls -la "$d" "$d/onnx"
            mkdir -p "pack/$name/onnx"
            cp "$d"/*.json "pack/$name/" 
            cp "$d/onnx/model_quantized.onnx" "pack/$name/onnx/"
            # Extra variants, so the app can use whichever runs best in the browser engine:
            #   int8 = only the matrix multiplies quantized · fp16 = half precision
            python - "$d/onnx/model.onnx" "pack/$name/onnx" <<'PY' > q.log 2>&1 || { tail -7 q.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          import sys, onnx
          from onnxruntime.quantization import quantize_dynamic, QuantType
          from onnxconverter_common import float16
          src, out = sys.argv[1], sys.argv[2]
          quantize_dynamic(src, f"{out}/model_int8.onnx", weight_type=QuantType.QInt8, op_types_to_quantize=["MatMul"], per_channel=False)
          m = float16.convert_float_to_float16(onnx.load(src), keep_io_types=True)
          onnx.save(m, f"{out}/model_fp16.onnx")
          PY
            ls -la "pack/$name/onnx"
            tar -C pack -czf "out/voice-$name.tar.gz" "$name"
          done < voices/list.txt
          ls -lh out
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voices
          name: Sparrow offline voices
          make_latest: false
          files: out/*.tar.gz
          body: |
            Offline voices for Sparrow (Urdu, Roman Urdu, Hindi, Punjabi), converted from Meta's MMS-TTS models
            (licence CC-BY-NC 4.0: free, non-commercial use). Sparrow downloads these by itself the first time you pick a language.
