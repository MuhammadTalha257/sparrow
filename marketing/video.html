<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sparrow — Warm Signal (30s)</title>
<style>
@font-face { font-family: Inter; font-weight: 200; src: url(fonts/inter-latin-200-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 300; src: url(fonts/inter-latin-300-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-cyrillic-400-normal.woff2) format('woff2'); unicode-range: U+0400-04FF; }
@font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 800; src: url(fonts/inter-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: Serif; font-style: normal; src: url(fonts/instrument-serif-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Serif; font-style: italic; src: url(fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }
@font-face { font-family: Arab; src: url(fonts/noto-sans-arabic-arabic-500-normal.woff2) format('woff2'); }
@font-face { font-family: Deva; src: url(fonts/noto-sans-devanagari-devanagari-500-normal.woff2) format('woff2'); }
@font-face { font-family: Guru; src: url(fonts/noto-sans-gurmukhi-gurmukhi-500-normal.woff2) format('woff2'); }
:root { --amber: #F9A830; --coral: #FF7A59; --cream: #FBF3E9; --muted: #C2B4A4; --teal: #7DE3DA; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0705; }
body { font-family: Inter, sans-serif; color: var(--cream); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1400px 900px at 50% 42%, #2A1A10 0%, #140C07 55%, #090604 100%); }
canvas { position: absolute; inset: 0; }
.abs { position: absolute; }
.frag { position: absolute; padding: 14px 22px; border-radius: 18px; font-size: 22px; font-weight: 600; white-space: nowrap; color: #EDE2D6;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.16);
  box-shadow: 0 18px 40px rgba(0,0,0,.45); display: flex; align-items: center; gap: 12px; }
.frag i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.headline { text-shadow: 0 0 40px rgba(12,8,5,.9), 0 0 90px rgba(12,8,5,.8); position: absolute; left: 0; right: 0; text-align: center; font-family: Serif; font-size: 104px; line-height: 1.02; letter-spacing: -1px; color: var(--cream); }
.headline em { font-style: italic; color: transparent; background: linear-gradient(90deg, #FFD9A0, #F9A830 45%, #FF8A66); -webkit-background-clip: text; text-shadow: none; }
.sub { position: absolute; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 300; letter-spacing: 8px; text-transform: uppercase; color: var(--muted); }
.card { position: absolute; padding: 20px 26px; border-radius: 24px; display: flex; align-items: center; gap: 18px; white-space: nowrap;
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.2); box-shadow: 0 26px 60px rgba(0,0,0,.45); }
.card .ok { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(52,211,153,.2); border: 1px solid rgba(52,211,153,.6); }
.card b { display: block; font-size: 26px; font-weight: 700; }
.card span { display: block; font-size: 18px; font-weight: 400; color: var(--muted); margin-top: 3px; }
.say { position: absolute; left: 230px; top: 760px; }
.say .who { font-size: 16px; font-weight: 600; letter-spacing: 6px; color: var(--amber); }
.say .txt { font-family: Serif; font-size: 58px; margin-top: 8px; white-space: nowrap; }
.greet { position: absolute; white-space: nowrap; font-size: 56px; font-weight: 500; color: var(--cream); text-shadow: 0 0 24px rgba(249,168,48,.35); }
.dev { position: absolute; }
.dev .lab { position: absolute; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 300; letter-spacing: 6px; text-transform: uppercase; color: var(--muted); }
.chip { display: inline-block; padding: 14px 26px; border-radius: 999px; font-size: 24px; font-weight: 600; background: rgba(249,168,48,.12); color: #FFD9A0; border: 1px solid rgba(249,168,48,.35); }
.chip.solid { background: linear-gradient(#FBC56A, #F28A3C); color: #1A1008; border: none; }
.wordmark { font-size: 150px; font-weight: 800; letter-spacing: -6px; color: transparent; background: linear-gradient(90deg, #FFE0A8, #F9A830 45%, #FF7A59); -webkit-background-clip: text; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="frags"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>

  <!-- scene 3: you speak -->
  <div class="say" id="say"><div class="who">YOU</div><div class="txt" id="sayT"></div></div>
  <div class="card" id="c1"><div class="ok"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#5EE6A8" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><b>Reminder set</b><span>Call Mum · 6:00 PM</span></div></div>
  <div class="card" id="c2"><div class="ok"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#5EE6A8" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><b>Focus mode on</b><span>Notifications paused</span></div></div>
  <div class="card" id="c3"><div class="ok"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#5EE6A8" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><b>Notes saved</b><span>Today’s meeting · 3 action items</span></div></div>

  <!-- scene 4: languages -->
  <div id="greets"></div>

  <!-- scene 6: devices -->
  <div id="devs"></div>

  <!-- the sparrow -->
  <svg id="bird" class="abs" viewBox="0 0 200 170" width="200" height="170" style="overflow:visible"></svg>

  <!-- words -->
  <div class="headline" id="hl"></div>
  <div class="sub" id="sub"></div>

  <!-- finale -->
  <div class="abs" id="final" style="left:0;right:0;top:600px;text-align:center">
    <div class="wordmark" id="wm">Sparrow</div>
    <div style="font-family:Serif;font-style:italic;font-size:56px;color:#EADCCB;margin-top:-6px" id="tag">Your voice is all it needs.</div>
    <div style="display:inline-flex;gap:16px;margin-top:38px" id="chips"><span class="chip">Free</span><span class="chip">Works offline</span><span class="chip solid">Mac · Windows · iPhone · Android</span></div>
  </div>
</div>

<script>
// ------------------------------------------------------------------ helpers
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const spring = x => x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(11 * x);
const env = (t, a, b, d = .5) => Math.min(eOut(prog(t, a, a + d)), 1 - eIO(prog(t, b - d * .8, b)));
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function vis(el, o, tf = '') { el.style.opacity = o; el.style.visibility = o < .003 ? 'hidden' : 'visible'; if (tf !== null) el.style.transform = tf; }

// ------------------------------------------------------------------ timeline (seconds)
const S = { chaos: 0, still: 4.6, wow: 8.2, speak: 8.6, lang: 13.6, off: 18.2, dev: 22.6, end: 26.6, out: 30 };
const C = { x: 960, y: 450 };          // the sparrow's home

// ------------------------------------------------------------------ the sparrow
const BIRD = `
<defs><linearGradient id="gB" x1="0.8" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#DDA672"/><stop offset="1" stop-color="#97633E"/></linearGradient>
<radialGradient id="gS" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
<clipPath id="bc"><ellipse cx="100" cy="92" rx="66" ry="56"/></clipPath></defs>
<g class="feet"><path d="M88 146 v10 m-5 0 h10 M112 146 v10 m-5 0 h10" stroke="#E8A040" stroke-width="3.5" stroke-linecap="round" fill="none"/></g>
<g class="tail"><path d="M150 104 Q176 82 190 62 Q196 74 194 86 Q182 104 162 122 Z" fill="#6B4228"/></g>
<g class="body"><ellipse cx="100" cy="92" rx="66" ry="56" fill="url(#gB)"/>
<g clip-path="url(#bc)"><ellipse cx="100" cy="128" rx="44" ry="40" fill="#F8ECD9"/><ellipse cx="100" cy="40" rx="64" ry="34" fill="#6B4228"/></g>
<ellipse cx="100" cy="92" rx="66" ry="56" fill="url(#gS)"/>
<g class="eyes"><g transform="translate(80 90)"><g class="eye"><rect x="-7.5" y="-10" width="15" height="20" rx="7.5" fill="#1A1412"/><circle cx="2.5" cy="-4.5" r="3.2" fill="#fff"/></g></g>
<g transform="translate(120 90)"><g class="eye"><rect x="-7.5" y="-10" width="15" height="20" rx="7.5" fill="#1A1412"/><circle cx="2.5" cy="-4.5" r="3.2" fill="#fff"/></g></g></g>
<path class="beak" d="M91 104 Q100 98 109 104 L100 118 Z" fill="#F9A830"/>
<ellipse cx="62" cy="108" rx="10" ry="6" fill="#FF8A8A" opacity=".38"/><ellipse cx="138" cy="108" rx="10" ry="6" fill="#FF8A8A" opacity=".38"/></g>
<g class="wing"><path d="M40 98 Q62 92 76 108 Q70 128 46 132 Q30 124 40 98 Z" fill="#7A4E30"/></g>`;
const bird = $('bird'); bird.innerHTML = BIRD;
const wing = bird.querySelector('.wing'), tail = bird.querySelector('.tail'), body = bird.querySelector('.body'), eyes = bird.querySelectorAll('.eye'), beak = bird.querySelector('.beak');

// ------------------------------------------------------------------ chaos fragments
const FR = ['12 unread', 'Meeting in 5 min', 'Don’t forget!', 'Where’s that file?', '47 tabs open', 'Update available', 'New message', 'Call back?',
  'Password?', 'Download failed', 'Reminder', '3 missed calls', 'Low battery', 'Calendar conflict', 'Which app was it?', 'Search…', 'Untitled document', 'Overdue',
  'Wi-Fi?', 'Copy · Paste · Repeat', 'One more click', 'Sign in again', 'Lost the link', 'Notes everywhere'];
const DOTS = ['#FF6B6B', '#F9A830', '#7DE3DA', '#93C5FD', '#F472B6', '#FBBF24'];
const rand = mulberry(42);
const frags = FR.map((txt, i) => {
  const el = document.createElement('div'); el.className = 'frag';
  el.innerHTML = `<i style="background:${DOTS[i % DOTS.length]}"></i>${txt}`;
  $('frags').appendChild(el);
  const ang = rand() * Math.PI * 2, rad = 260 + rand() * 520;
  let fy = C.y + 40 + Math.sin(ang) * rad * .62;
  if (Math.abs(fy - 525) < 125) fy = 525 + Math.sign(fy - 525 || 1) * (125 + rand() * 40);
  return { el, x: C.x + Math.cos(ang) * rad * 1.35, y: fy, vx: (rand() - .5) * 60, vy: (rand() - .5) * 14,
           rot: (rand() - .5) * 16, born: .1 + i * .14, ph: rand() * 6.28, sc: .8 + rand() * .45 };
});

// particles born from the fragments when they dissolve
const P = []; const prand = mulberry(7);
frags.forEach((f, i) => { for (let k = 0; k < 26; k++) P.push({ f, ox: (prand() - .5) * 220, oy: (prand() - .5) * 46, sp: .6 + prand() * .9, sw: (prand() - .5) * 2, hue: prand(), d: prand() * .6 }); });
// floating dust (always)
const DUST = Array.from({ length: 90 }, (_, i) => { const r = mulberry(100 + i); return { x: r() * 1920, y: r() * 1080, s: .5 + r() * 1.8, v: 6 + r() * 14, ph: r() * 6.28 }; });

// ------------------------------------------------------------------ greetings
const GREET = [['Hello', 'Inter'], ['سلام', 'Arab'], ['नमस्ते', 'Deva'], ['Hola', 'Inter'], ['ਸਤ ਸ੍ਰੀ ਅਕਾਲ', 'Guru'], ['Bonjour', 'Inter'], ['Merhaba', 'Inter'], ['Привет', 'Inter'], ['Ciao', 'Inter'], ['مرحبا', 'Arab']];
const greets = GREET.map(([w, f]) => { const el = document.createElement('div'); el.className = 'greet'; el.textContent = w; el.style.fontFamily = f + ', Inter'; $('greets').appendChild(el); return el; });

// ------------------------------------------------------------------ devices (outline drawings, no logos)
const DEV = [
  { name: 'Mac', x: 300, w: 300, h: 210, svg: `<rect x="20" y="8" width="260" height="168" rx="14" class="frame"/><rect x="34" y="22" width="232" height="140" rx="6" class="scr"/><path d="M0 186 h300 l-14 16 h-272 z" class="frame"/>` },
  { name: 'Windows', x: 700, w: 300, h: 210, svg: `<rect x="20" y="8" width="260" height="168" rx="6" class="frame"/><rect x="30" y="18" width="240" height="148" rx="2" class="scr"/><rect x="30" y="152" width="240" height="14" class="bar"/><path d="M10 186 h280 l-10 14 h-260 z" class="frame"/>` },
  { name: 'iPhone', x: 1130, w: 130, h: 250, svg: `<rect x="4" y="4" width="122" height="242" rx="26" class="frame"/><rect x="12" y="12" width="106" height="226" rx="20" class="scr"/><rect x="45" y="18" width="40" height="12" rx="6" class="notch"/>` },
  { name: 'Android', x: 1450, w: 130, h: 250, svg: `<rect x="4" y="4" width="122" height="242" rx="18" class="frame"/><rect x="11" y="11" width="108" height="228" rx="12" class="scr"/><circle cx="65" cy="22" r="5" class="notch"/>` },
];
DEV.forEach(d => {
  const el = document.createElement('div'); el.className = 'dev'; el.style.left = d.x + 'px'; el.style.top = (560 - d.h) + 'px'; el.style.width = d.w + 'px'; el.style.height = (d.h + 60) + 'px';
  el.innerHTML = `<svg width="${d.w}" height="${d.h}" viewBox="0 0 ${d.w} ${d.h}" style="overflow:visible"><style>.frame{fill:none;stroke:rgba(251,243,233,.75);stroke-width:2.2}.scr{fill:rgba(249,168,48,.0);stroke:rgba(251,243,233,.25);stroke-width:1.2}.bar{fill:rgba(251,243,233,.12)}.notch{fill:rgba(251,243,233,.5)}</style>${d.svg}</svg><div class="lab" style="top:${d.h + 22}px">${d.name}</div>`;
  $('devs').appendChild(el); d.el = el; d.scr = el.querySelectorAll('.scr');
  d.cx = d.x + d.w / 2; d.cy = 560 - d.h + (d.name === 'Mac' || d.name === 'Windows' ? 92 : 125);
});

// ------------------------------------------------------------------ words
const WORDS = [
  [S.chaos + .7, S.still - .1, 'Too many <em>clicks</em>.', ''],
  [S.still + .5, S.wow - .25, 'What if it just <em>listened</em>?', ''],
  [S.speak + 2.6, S.lang, 'You say it. <em>It’s done.</em>', ''],
  [S.lang + .4, S.off, 'Many languages. <em>One friend.</em>', 'Multi-language support'],
  [S.off + .4, S.dev, 'No internet? <em>Still here.</em>', 'Private · on your device'],
  [S.dev + .4, S.end, 'Wherever <em>you</em> are.', ''],
];
const POS = { 0: [470, 0], 1: [800, 0], 2: [810, 0], 3: [800, 935], 4: [800, 935], 5: [118, 0] };

const bg = $('bg').getContext('2d'), fx = $('fx').getContext('2d');

function drawRingOrb(ctx, x, y, R, t, energy, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'lighter';
  const pal = ['#FFB347', '#FF7A59', '#FFD27A', '#7DE3DA', '#F9A830'];
  for (let i = 0; i < 34; i++) {
    ctx.beginPath();
    for (let k = 0; k <= 140; k++) {
      const a = k / 140 * Math.PI * 2;
      const w = Math.sin(a * 3 + t * (.7 + i * .04) + i) * .55 + Math.sin(a * 5 - t * 1.2 + i * .7) * .3 + Math.sin(a * 9 + t * 2 + i * 1.9) * .15;
      const r = R * (1 + .045 * (i % 6)) + w * R * .15 * (.6 + energy);
      k ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.strokeStyle = pal[i % 5]; ctx.globalAlpha = alpha * (.08 + .12 * energy); ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
}

function render(t) {
  // ---------------- background: dusk light, slow dust, vignette
  bg.clearRect(0, 0, 1920, 1080);
  const dim = 1 - .55 * env(t, S.off + .9, S.dev, .7);            // the world dims when the internet goes away
  const g = bg.createRadialGradient(C.x, C.y, 40, C.x, C.y, 900);
  g.addColorStop(0, `rgba(120,70,30,${.32 * dim})`); g.addColorStop(.5, `rgba(60,34,18,${.22 * dim})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  bg.fillStyle = g; bg.fillRect(0, 0, 1920, 1080);
  for (const d of DUST) {
    const y = (d.y - t * d.v + 1080) % 1080, x = d.x + Math.sin(t * .4 + d.ph) * 20;
    bg.fillStyle = `rgba(255,214,160,${(.10 + .12 * Math.sin(t + d.ph) ** 2) * dim})`; bg.beginPath(); bg.arc(x, y, d.s, 0, 6.283); bg.fill();
  }

  // ---------------- chaos: fragments pile up, jitter, freeze, then dissolve
  const freeze = eOut(prog(t, S.still, S.still + .5));
  const dissolve = prog(t, S.still + .9, S.still + 1.7);
  for (const f of frags) {
    const appear = back(prog(t, f.born, f.born + .45));
    const tt = Math.min(t, S.still + .2 * freeze);
    const jitter = (1 - freeze) * Math.min(1, t / 3) * 6;
    const x = f.x + f.vx * tt * .35 + Math.sin(t * 9 + f.ph) * jitter, y = f.y + f.vy * tt * .35 + Math.cos(t * 7 + f.ph) * jitter;
    const o = Math.min(1, prog(t, f.born, f.born + .3)) * (1 - dissolve) * (1 - .35 * freeze);
    f.el.style.left = x + 'px'; f.el.style.top = y + 'px';
    f.el.style.filter = `saturate(${1 - freeze * .9}) blur(${dissolve * 3}px)`;
    vis(f.el, o, `translate(-50%,-50%) rotate(${f.rot * (1 - freeze * .6)}deg) scale(${f.sc * appear * (1 - .1 * dissolve)})`);
    f.cx = x; f.cy = y;
  }

  // ---------------- effects layer
  fx.clearRect(0, 0, 1920, 1080);
  // particles: born at the fragments, spiral into the centre, become the orb
  if (t > S.still + .8 && t < S.wow + .6) {
    fx.save(); fx.globalCompositeOperation = 'lighter';
    for (const p of P) {
      const k = eIO(prog(t, S.still + .9 + p.d, S.wow - .25));
      if (!p.f.cx) continue;
      const sx = p.f.cx + p.ox, sy = p.f.cy + p.oy;
      const ang = Math.atan2(sy - C.y, sx - C.x) + k * (2.4 + p.sw), rad = Math.hypot(sx - C.x, sy - C.y) * (1 - k);
      const x = C.x + Math.cos(ang) * rad, y = C.y + Math.sin(ang) * rad;
      const a = (prog(t, S.still + .9 + p.d, S.still + 1.3 + p.d)) * (1 - prog(t, S.wow, S.wow + .5));
      const col = p.hue < .6 ? '255,190,110' : p.hue < .85 ? '255,140,100' : '125,227,218';
      fx.fillStyle = `rgba(${col},${a * .85})`; fx.beginPath(); fx.arc(x, y, 1.6 + p.sp, 0, 6.283); fx.fill();
    }
    fx.restore();
  }
  // the orb: gathers, flashes (WOW), then lives behind the sparrow
  const orbIn = eOut(prog(t, S.wow - 1.0, S.wow));
  const orbOut = 1 - eIO(prog(t, S.out - .6, S.out));
  const listening = (t > S.speak + .6 && t < S.speak + 2.4);
  const energy = t < S.wow ? .4 + .6 * orbIn : listening ? .75 + .25 * Math.abs(Math.sin(t * 9)) : .3;
  let bx = C.x, by = C.y, bs = 1.55;
  // sparrow travels across the devices
  if (t > S.dev + .3 && t < S.end + .2) {
    const hops = DEV.length, seg = (S.end - S.dev - .5) / hops, u = (t - S.dev - .3) / seg, i = Math.min(hops - 1, Math.floor(u)), f = u - i;
    const from = i === 0 ? { cx: C.x, cy: C.y } : DEV[i - 1], to = DEV[i];
    const k = eIO(clamp(f / .55));
    bx = lerp(from.cx, to.cx, k); by = lerp(from.cy, to.cy, k) - Math.sin(k * Math.PI) * 140; bs = lerp(i === 0 ? 1.55 : .55, .55, k);
    DEV.forEach((d, j) => d.scr.forEach(s => s.style.fill = `rgba(249,168,48,${j < i || (j === i && k > .9) ? .22 : 0})`));
  } else if (t >= S.end + .2) {
    const k = eIO(prog(t, S.end + .2, S.end + 1.1)), last = DEV[DEV.length - 1];
    bx = lerp(last.cx, C.x, k); by = lerp(last.cy, C.y - 70, k) - Math.sin(k * Math.PI) * 120; bs = lerp(.55, 1.45, k);
  }
  const orbX = t > S.dev ? C.x : bx, orbY = t > S.dev ? C.y : by;
  const orbVis = orbIn * orbOut * (1 - env(t, S.dev + .2, S.end + .3, .5) * .85);
  if (orbVis > .01) {
    const og = fx.createRadialGradient(orbX, orbY, 10, orbX, orbY, 420);
    og.addColorStop(0, `rgba(249,168,48,${(.22 + .25 * energy) * orbVis})`); og.addColorStop(1, 'rgba(249,168,48,0)');
    fx.fillStyle = og; fx.fillRect(0, 0, 1920, 1080);
    drawRingOrb(fx, orbX, orbY, 150 * (.5 + .5 * orbIn), t, energy, orbVis);
    fx.save(); fx.globalAlpha = orbVis * .96; const core = fx.createRadialGradient(orbX - 40, orbY - 50, 4, orbX, orbY, 150);
    core.addColorStop(0, '#2E2A2A'); core.addColorStop(1, '#120D0A'); fx.fillStyle = core; fx.beginPath(); fx.arc(orbX, orbY, 128 * (.5 + .5 * orbIn), 0, 6.283); fx.fill();
    fx.strokeStyle = 'rgba(255,220,170,.16)'; fx.lineWidth = 1.2; fx.stroke(); fx.restore();
  }
  // WOW: flash, light rays, shockwave rings
  const w = prog(t, S.wow, S.wow + 1.4);
  if (w > 0 && w < 1) {
    fx.save(); fx.globalCompositeOperation = 'lighter';
    for (let r = 0; r < 3; r++) {
      const q = clamp(w * 1.6 - r * .18); if (q <= 0 || q >= 1) continue;
      fx.strokeStyle = `rgba(255,210,150,${(1 - q) * .55})`; fx.lineWidth = 3 * (1 - q) + .5;
      fx.beginPath(); fx.arc(C.x, C.y, 140 + eOut(q) * 900, 0, 6.283); fx.stroke();
    }
    for (let i = 0; i < 28; i++) {
      const a = i / 28 * 6.283 + .1, len = 420 + 260 * Math.sin(i * 7.3);
      const gr = fx.createLinearGradient(C.x, C.y, C.x + Math.cos(a) * len, C.y + Math.sin(a) * len);
      gr.addColorStop(0, `rgba(255,200,130,${.32 * (1 - w)})`); gr.addColorStop(1, 'rgba(255,200,130,0)');
      fx.strokeStyle = gr; fx.lineWidth = 3; fx.beginPath(); fx.moveTo(C.x, C.y); fx.lineTo(C.x + Math.cos(a) * len * eOut(w), C.y + Math.sin(a) * len * eOut(w)); fx.stroke();
    }
    fx.fillStyle = `rgba(255,236,200,${Math.max(0, .55 - w * 1.4)})`; fx.fillRect(0, 0, 1920, 1080);
    fx.restore();
  }
  // voice ribbon: from your words to the sparrow
  const rib = env(t, S.speak + .5, S.speak + 2.9, .4);
  if (rib > .01) {
    fx.save(); fx.globalCompositeOperation = 'lighter';
    for (let l = 0; l < 5; l++) {
      fx.beginPath();
      for (let k = 0; k <= 160; k++) {
        const u = k / 160, x0 = 520, y0 = 740, x1 = C.x - 120, y1 = C.y + 40;
        const x = lerp(x0, x1, u), y = lerp(y0, y1, u) - Math.sin(u * Math.PI) * 120;
        const amp = Math.sin(u * Math.PI) * (18 + 14 * Math.sin(t * 6 + l)) * (1 + Math.sin(u * 30 - t * 14) * .2);
        const yy = y + Math.sin(u * 22 - t * 10 + l * .8) * amp;
        k ? fx.lineTo(x, yy) : fx.moveTo(x, yy);
      }
      fx.strokeStyle = l % 2 ? `rgba(125,227,218,${.3 * rib})` : `rgba(249,168,48,${.45 * rib})`; fx.lineWidth = 2; fx.stroke();
    }
    fx.restore();
  }
  // languages: an orbit path
  const lo = env(t, S.lang + .2, S.off, .6);
  if (lo > .01) { fx.save(); fx.strokeStyle = `rgba(249,168,48,${.18 * lo})`; fx.lineWidth = 1.2; fx.setLineDash([2, 10]);
    fx.beginPath(); fx.ellipse(C.x, C.y, 560, 170, 0, 0, 6.283); fx.stroke(); fx.restore(); }
  // offline: Wi-Fi arcs, struck through; a soft shield around the sparrow
  const off = env(t, S.off + .2, S.dev, .5);
  if (off > .01) {
    const wx = C.x, wy = 205;
    fx.save(); fx.lineCap = 'round';
    for (let i = 0; i < 3; i++) { fx.strokeStyle = `rgba(251,243,233,${.55 * off})`; fx.lineWidth = 7; fx.beginPath(); fx.arc(wx, wy + 40, 26 + i * 26, Math.PI * 1.22, Math.PI * 1.78); fx.stroke(); }
    fx.fillStyle = `rgba(251,243,233,${.55 * off})`; fx.beginPath(); fx.arc(wx, wy + 40, 7, 0, 6.283); fx.fill();
    const sl = eOut(prog(t, S.off + .7, S.off + 1.1));
    fx.strokeStyle = `rgba(255,122,89,${.95 * off})`; fx.lineWidth = 8; fx.beginPath(); fx.moveTo(wx - 62, wy - 40); fx.lineTo(wx - 62 + 124 * sl, wy - 40 + 110 * sl); fx.stroke();
    const sh = eOut(prog(t, S.off + 1.4, S.off + 2.2)) * off;
    fx.strokeStyle = `rgba(125,227,218,${.6 * sh})`; fx.lineWidth = 3; fx.shadowColor = 'rgba(125,227,218,.8)'; fx.shadowBlur = 18;
    fx.beginPath(); const sx = C.x, sy = C.y - 170, s = 1.0 + .03 * Math.sin(t * 3);
    fx.moveTo(sx, sy); fx.bezierCurveTo(sx + 120 * s, sy + 30, sx + 190 * s, sy + 30, sx + 190 * s, sy + 30);
    fx.bezierCurveTo(sx + 200 * s, sy + 230, sx + 120 * s, sy + 330, sx, sy + 380 * s);
    fx.bezierCurveTo(sx - 120 * s, sy + 330, sx - 200 * s, sy + 230, sx - 190 * s, sy + 30);
    fx.bezierCurveTo(sx - 190 * s, sy + 30, sx - 120 * s, sy + 30, sx, sy); fx.stroke();
    fx.restore();
  }
  // finale: hearts + a warm ring
  const fin = prog(t, S.end + 1.0, S.end + 2.6);
  if (fin > 0) {
    fx.save(); fx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI / 2 + (i - 4) * .32, p = clamp(fin * 1.3 - i * .04), r = 120 + eOut(p) * 140;
      const x = C.x + Math.cos(a) * r, y = C.y - 70 + Math.sin(a) * r * .8 - p * 30, o = Math.sin(p * Math.PI) * .9;
      if (o <= 0) continue;
      fx.fillStyle = `rgba(255,107,138,${o})`; fx.beginPath(); const s = 11 + 6 * Math.sin(p * Math.PI);
      fx.moveTo(x, y + s * .9); fx.bezierCurveTo(x - s * 1.6, y - s * .2, x - s * .6, y - s * 1.4, x, y - s * .5); fx.bezierCurveTo(x + s * .6, y - s * 1.4, x + s * 1.6, y - s * .2, x, y + s * .9); fx.fill();
    }
    fx.restore();
  }

  // ---------------- the sparrow
  const born = spring(prog(t, S.wow, S.wow + .9));
  const flying = (t > S.dev + .3 && t < S.end + 1.2);
  bird.style.left = (bx - 100) + 'px'; bird.style.top = (by - 85 + Math.sin(t * 2.2) * 5) + 'px';
  vis(bird, prog(t, S.wow - .05, S.wow + .15) * orbOut, `scale(${bs * born})`);
  const flap = flying ? Math.sin(t * 36) * 34 : listening ? Math.sin(t * 20) * 20 : t < S.wow + .8 ? Math.sin(t * 30) * 28 : Math.sin(t * 2.4) * 3;
  wing.setAttribute('transform', `rotate(${flap} 70 100)`);
  tail.setAttribute('transform', `rotate(${Math.sin(t * 2.6) * 5} 150 104)`);
  const blink = (t % 3.9) < .12 ? .1 : 1;
  eyes.forEach(e => e.setAttribute('transform', `scale(1 ${blink})`));
  beak.setAttribute('transform', `translate(0 ${(t > S.speak + 2.5 && t < S.speak + 3.2) ? Math.abs(Math.sin(t * 18)) * 2 : 0})`);

  // ---------------- you speak
  const sayO = env(t, S.speak + .3, S.speak + 2.75, .3);
  vis($('say'), sayO, `translateY(${(1 - eOut(prog(t, S.speak + .3, S.speak + .8))) * 30}px)`);
  const line = 'Remind me to call Mum at six…';
  $('sayT').textContent = line.slice(0, Math.max(0, Math.floor((t - S.speak - .5) * 20)));
  [['c1', 1340, 300, 2.4], ['c2', 1360, 470, 2.75], ['c3', 1310, 640, 3.1]].forEach(([id, x, y, d]) => {
    const a = S.speak + d, el = $(id); el.style.left = x + 'px'; el.style.top = y + 'px';
    vis(el, env(t, a, S.lang - .1, .35), `translateX(${(1 - eOut(prog(t, a, a + .5))) * -90}px) scale(${.85 + .15 * back(prog(t, a, a + .5))})`);
  });

  // ---------------- languages orbit
  greets.forEach((el, i) => {
    const a = i / greets.length * 6.283 + (t - S.lang) * .38;
    const z = Math.sin(a), x = C.x + Math.cos(a) * 560, y = C.y + z * 170;
    const o = lo * (.35 + .65 * (z + 1) / 2) * prog(t, S.lang + .2 + i * .09, S.lang + .6 + i * .09);
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.zIndex = z > 0 ? 6 : 1;
    vis(el, o, `translate(-50%,-50%) scale(${.62 + .5 * (z + 1) / 2})`);
  });
  bird.style.zIndex = 5;

  // ---------------- devices
  DEV.forEach((d, i) => {
    const a = S.dev + .15 + i * .12;
    vis(d.el, env(t, a, S.end + .6, .45), `translateY(${(1 - back(prog(t, a, a + .6))) * 60}px)`);
  });

  // ---------------- headlines
  let shown = false;
  WORDS.forEach(([a, b, html, sub], i) => {
    if (t >= a && t < b) {
      shown = true;
      if ($('hl').innerHTML !== html) { $('hl').innerHTML = html; $('sub').textContent = sub; }
      const o = env(t, a, b, .6), [top, subTop] = POS[i];
      $('hl').style.top = top + 'px'; $('sub').style.top = (subTop || top + 132) + 'px';
      vis($('hl'), o, `translateY(${(1 - eOut(prog(t, a, a + .7))) * 26}px)`); $('hl').style.filter = `blur(${(1 - eOut(prog(t, a, a + .5))) * 8}px)`;
      vis($('sub'), sub ? o * eOut(prog(t, a + .35, a + .9)) : 0, null);
    }
  });
  if (!shown) { vis($('hl'), 0, null); vis($('sub'), 0, null); }

  // ---------------- finale
  const fo = eOut(prog(t, S.end + 1.0, S.end + 1.7));
  vis($('final'), fo * orbOut, `translateY(${(1 - fo) * 30}px)`);
  vis($('tag'), eOut(prog(t, S.end + 1.4, S.end + 2.0)), null);
  vis($('chips'), eOut(prog(t, S.end + 1.8, S.end + 2.4)), `scale(${.92 + .08 * back(prog(t, S.end + 1.8, S.end + 2.4))})`);
  $('stage').style.opacity = Math.min(prog(t, 0, .4), 1 - prog(t, S.out - .35, S.out) * .95);
}
window.renderAt = render; window.DURATION = S.out;
render(0);
document.fonts.load('56px Arab', 'سلام').then(() => document.fonts.load('56px Deva', 'नमस्ते')).then(() => document.fonts.load('56px Guru', 'ਸਤ')).then(() => document.fonts.load('104px Serif')).then(() => document.fonts.load('italic 104px Serif')).then(() => document.fonts.ready).then(() => { window.READY = true; });
if (!/[?&]capture/.test(location.search)) { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % S.out); requestAnimationFrame(loop); })(); }
</script>
