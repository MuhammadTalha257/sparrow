<!doctype html>
<html><head><meta charset="utf-8"><title>Zuffi</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  /* Aurora, the same 3D bunny as on the Mac */
  #pet { position: absolute; bottom: 0; left: 0; width: 170px; height: 180px; cursor: grab; will-change: transform; }
  #pet canvas { width: 100%; height: 100%; display: block; pointer-events: none; }
  #pet.hidden { display: none; }
  /* her speech bubble, like the Mac: dark card, white words, green "Done" */
  #card { position: absolute; bottom: 186px; left: 0; max-width: 360px; padding: 10px 10px 10px 14px; border-radius: 16px; color: #fff; background: #1B1A18;
    box-shadow: 0 14px 34px rgba(12,12,12,.3); opacity: 0; transform: translateY(10px) scale(.9); transition: opacity .3s, transform .3s cubic-bezier(.34,1.56,.64,1); pointer-events: none;
    display: flex; align-items: center; gap: 10px; z-index: 2; }
  #card.on { opacity: 1; transform: none; pointer-events: auto; }
  #card::after { content: ""; position: absolute; top: 100%; left: var(--tail, 40px); border: 7px solid transparent; border-top-color: var(--fill, #1B1A18); }
  #card.good { --fill: #2E9D6A; background: #2E9D6A; }
  #card.bad { --fill: #C2483F; background: #C2483F; }
  #card .t { font-size: 14px; font-weight: 700; line-height: 1.35; }
  #card .b { display: flex; gap: 6px; flex: none; }
  #card button { font: inherit; font-size: 12.5px; font-weight: 700; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; color: rgba(255,255,255,.9); background: rgba(255,255,255,.14); transition: transform .15s, background .15s; }
  #card button.solid { color: #1B1A18; background: #fff; }
  #card button:active, #card button.pressed { transform: scale(.9); }
</style></head>
<body><div id="card"><div class="t" id="cT"></div><div class="b" id="cB"></div></div>
<div id="pet"><canvas id="aurora" width="340" height="360"></canvas></div>
<script type="module" src="pet.js"></script></body></html>
