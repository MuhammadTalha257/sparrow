name: Render launch film

on:
  push:
    paths: [".github/workflows/film.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # The film is delivered in chat, not stored in the repo or releases.
  cleanup:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git push origin --delete launch-film-files || true
          gh release delete launch-film --cleanup-tag -y || true
  film:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Tools
        working-directory: marketing
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium > /dev/null
      - name: Render (animation + Kokoro voiceover + score)
        working-directory: marketing
        run: |
          node render.mjs out 2>&1 | tee render.log
          grep -E "^line" render.log | while IFS= read -r l; do echo "::notice::$l"; done
          ls -lh out
      - uses: actions/upload-artifact@v4
        with: { name: sparrow-launch-film, path: marketing/out/sparrow-30s.mp4, retention-days: 7 }
