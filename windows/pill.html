<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
    font: 13px/1.2 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #FBF3E9; }
  .pill { position: absolute; inset: 4px 6px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 6px;
    border-radius: 22px; cursor: pointer; -webkit-app-region: drag;
    background: linear-gradient(180deg, rgba(48,31,20,.92), rgba(24,15,10,.92));
    border: 1px solid rgba(249,168,48,.28); box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,220,170,.08); }
  .bird { width: 34px; height: 34px; border-radius: 50%; flex: none; -webkit-app-region: no-drag;
    background: url(www/icons/icon-192.png) center/cover; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px) rotate(-3deg); } }
  .txt { flex: 1; min-width: 0; -webkit-app-region: no-drag; }
  .t1 { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t2 { color: #C9B6A2; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 0; color: #1A1008;
    background: linear-gradient(180deg, #FBC56A, #F28A3C); cursor: pointer; -webkit-app-region: no-drag; }
  .pill.listening { border-color: rgba(249,168,48,.9); animation: glow 1.1s ease-out infinite; }
  .pill.listening .mic { background: #F87171; color: #fff; }
  .pill.speaking .bird { animation: talk .25s ease-in-out infinite alternate; }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(249,168,48,.55); } 100% { box-shadow: 0 0 0 10px rgba(249,168,48,0); } }
  @keyframes talk { to { transform: scale(1.08) rotate(4deg); } }
</style>
</head>
<body>
<div class="pill" id="pill">
  <div class="bird" id="bird" title="Open Sparrow"></div>
  <div class="txt" id="txt"><div class="t1" id="t1">Sparrow</div><div class="t2" id="t2">Say “Sparrow…”</div></div>
  <button class="mic" id="mic" title="Talk">
    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/></svg>
  </button>
</div>
<script>
  const D = window.SparrowDesktop, pill = document.getElementById('pill');
  document.getElementById('bird').onclick = document.getElementById('txt').onclick = () => D.pillClick();
  document.getElementById('mic').onclick = () => D.pillTalk();
  D.onState(s => {
    if (s.hello) document.getElementById('t1').textContent = s.hello;
    if (s.next) document.getElementById('t2').textContent = s.next;
    if ('listening' in s) { pill.classList.toggle('listening', s.listening); if (s.listening) document.getElementById('t2').textContent = 'Listening…'; }
    if ('speaking' in s) pill.classList.toggle('speaking', s.speaking);
  });
</script>
</body>
</html>
