name: Build Mac app

on:
  push:
    branches: [main, test]
    paths: ["mac/**", ".github/workflows/mac.yml", "*.js", "*.html", "*.css", "lib/**", "tools/voice-lib/**"]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  # 2) The Mac island app with everything inside.
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Copy the Sparrow web app
        run: |
          mkdir -p mac/Resources/web
          cp index.html style.css app.js brain.js store.js ai.js i18n.js prayer.js memory.js tools.js sync.js neuralvoice.js manifest.webmanifest mac/Resources/web/
          cp -R lib icons mac/Resources/web/

      - name: Build the natural voice engine (sherpa-onnx)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          TAG=$(gh release view --repo k2-fsa/sherpa-onnx --json tagName -q .tagName)
          echo "::notice::sherpa-onnx $TAG"
          mkdir -p dl
          gh release download "$TAG" --repo k2-fsa/sherpa-onnx -p "sherpa-onnx-$TAG-osx-universal2-shared.tar.bz2" -D dl \
            || { gh release view "$TAG" --repo k2-fsa/sherpa-onnx --json assets -q '.assets[].name' | grep osx | head -9 | while read -r a; do echo "::warning::$a"; done; fail "no osx-universal2-shared asset"; }
          tar -xjf dl/*.tar.bz2 -C dl
          SH=$(find dl -maxdepth 1 -type d -name 'sherpa-onnx-*' | head -1)
          ls "$SH" "$SH/lib"
          OUT=mac/Resources/speech; mkdir -p "$OUT"
          for a in arm64 x86_64; do
            swiftc -O -swift-version 5 -target $a-apple-macos11 mac/speech/SparrowSpeech.swift \
              -import-objc-header "$SH/include/sherpa-onnx/c-api/c-api.h" -L "$SH/lib" -lsherpa-onnx-c-api \
              -Xlinker -rpath -Xlinker @executable_path -o sp-$a 2>&1 | tee -a swift.log
          done
          grep -E "error:" swift.log | head -9 | while IFS= read -r l; do echo "::error::$l"; done
          lipo -create sp-arm64 sp-x86_64 -output "$OUT/SparrowSpeech"
          cp -a "$SH"/lib/*.dylib "$OUT/"
          otool -L "$OUT/SparrowSpeech" | head
          # English voice: Kokoro (int8)
          gh release download tts-models --repo k2-fsa/sherpa-onnx -p 'kokoro-int8-multi-lang-v1_0.tar.bz2' -D dl || fail "kokoro model missing"
          tar -xjf dl/kokoro-int8-multi-lang-v1_0.tar.bz2 -C dl
          K=$(find dl -maxdepth 1 -type d -name 'kokoro-int8-multi-lang-v1_0*' | head -1); ls -la "$K"
          mkdir -p "$OUT/kokoro"
          cp "$K"/*.onnx "$K/voices.bin" "$K/tokens.txt" "$OUT/kokoro/"
          [ -f "$K/lexicon-us-en.txt" ] && cp "$K/lexicon-us-en.txt" "$OUT/kokoro/"
          cp -R "$K/espeak-ng-data" "$OUT/kokoro/"
          # Urdu / Roman Urdu / Hindi / Punjabi: MMS (int8)
          gh release download voices-native -p 'vits-mms-*.tar.bz2' -D dl --repo "$GITHUB_REPOSITORY" || fail "native MMS voices missing"
          for f in dl/vits-mms-*.tar.bz2; do
            n=$(basename "$f" .tar.bz2); n=${n#vits-mms-}
            tar -xjf "$f" -C dl && mkdir -p "$OUT/mms-$n" && cp dl/vits-mms-$n/* "$OUT/mms-$n/"
          done
          find "$OUT" -name '*.dylib' -o -name SparrowSpeech | while read -r f; do codesign --force -s - "$f" 2>/dev/null || true; done
          du -sh "$OUT"/*

      - name: Test the voice engine
        run: |
          OUT=mac/Resources/speech
          ( printf '%s\n' \
            '{"cmd":"render","text":"Hi Talha! You have a meeting with Ali in five minutes. Shall I open Zoom for you?","model":"kokoro","sid":3,"path":"/tmp/en.wav"}' \
            '{"cmd":"render","text":"السلام علیکم طلحہ! پانچ منٹ میں آپ کی میٹنگ ہے۔","model":"urd","path":"/tmp/ur.wav"}' \
            '{"cmd":"render","text":"Talha, aap ki meeting paanch minute mein hai.","model":"urd-latn","path":"/tmp/url.wav"}' \
            '{"cmd":"render","text":"नमस्ते तलहा! पाँच मिनट में आपकी मीटिंग है।","model":"hin","path":"/tmp/hi.wav"}' \
            '{"cmd":"render","text":"ਸਤ ਸ੍ਰੀ ਅਕਾਲ! ਪੰਜ ਮਿੰਟ ਵਿੱਚ ਤੁਹਾਡੀ ਮੀਟਿੰਗ ਹੈ।","model":"pan","path":"/tmp/pa.wav"}'; sleep 90 ) \
            | "$OUT/SparrowSpeech" "$OUT" > speech.log 2>&1 &
          for i in $(seq 1 90); do [ "$(grep -c rendered speech.log)" -ge 5 ] && break; sleep 1; done
          cat speech.log
          grep -E '"ev":"(rendered|loaded|error)"' speech.log | while IFS= read -r l; do echo "::notice::$l"; done
          [ "$(grep -c rendered speech.log)" -ge 5 ] || { echo "::error::voice engine test failed"; exit 1; }
          mkdir -p samples && cp /tmp/en.wav samples/sparrow-native-english.wav && cp /tmp/ur.wav samples/sparrow-native-urdu.wav \
            && cp /tmp/url.wav samples/sparrow-native-roman-urdu.wav && cp /tmp/hi.wav samples/sparrow-native-hindi.wav && cp /tmp/pa.wav samples/sparrow-native-punjabi.wav

      - name: Publish voice samples
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-samples
          name: Sparrow voice samples
          prerelease: true
          make_latest: false
          files: samples/*

      - name: Build Sparrow.app (Apple silicon + Intel)
        working-directory: mac
        run: |
          xcodebuild -version
          du -sh Resources/web
          set +e
          xcodebuild -project Sparrow.xcodeproj -target NotchBuddy -configuration Release \
            SYMROOT="$PWD/build" ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            build > build.log 2>&1
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -80
          grep -q "BUILD SUCCEEDED" build.log

      - name: Report build errors as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Mac build failed at ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"; echo; echo '```'; grep -E "error:" mac/build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -80; echo '```'; } > body.md
          gh label create build-errors --color B60205 -f >/dev/null 2>&1 || true
          N=$(gh issue list --label build-errors --state open --json number -q '.[0].number')
          if [ -z "$N" ]; then gh issue create --title "Build errors" --label build-errors --body-file body.md; else gh issue comment "$N" --body-file body.md; fi

      - name: Make the download (.dmg)
        run: |
          du -sh mac/build/Release/Sparrow.app/Contents/Resources/speech
          mkdir -p dmg && cp -R mac/build/Release/Sparrow.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Sparrow" -srcfolder dmg -ov -format UDZO Sparrow.dmg
          ls -lh Sparrow.dmg

      - name: Close the build-errors issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list --label build-errors --state open --json number -q '.[0].number' 2>/dev/null)
          [ -n "$N" ] && gh issue close "$N" --comment "Mac build fixed at ${GITHUB_SHA::7} ✅" || true

      - name: Publish test download
        if: github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-test
          name: Sparrow for Mac (test copy)
          prerelease: true
          make_latest: false
          files: Sparrow.dmg
          body: |
            **Test copy** — try it before it becomes the main download.
            1. Quit Sparrow (menu bar icon → Quit).
            2. Download `Sparrow.dmg`, open it, drag **Sparrow** onto **Applications** and choose **Replace**.
            3. Open it; if macOS blocks it: System Settings → Privacy & Security → **Open Anyway**.

      - name: Publish download
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: Sparrow for Mac
          make_latest: false
          files: Sparrow.dmg
          body: |
            **Install Sparrow on your Mac**
            1. Download `Sparrow.dmg` and open it.
            2. Drag **Sparrow** onto **Applications**.
            3. Open Sparrow from Applications. The first time, macOS says it can't check the developer:
               open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** (only once).
