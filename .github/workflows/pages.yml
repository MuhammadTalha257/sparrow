name: Publish website (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore: ["android/**", "desktop/**", "website/**", ".github/workflows/android.yml", ".github/workflows/desktop.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Site files
        run: |
          mkdir -p _site
          cp -r index.html get.html *.js *.css manifest.webmanifest lib icons _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
