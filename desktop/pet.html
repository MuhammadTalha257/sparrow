<!doctype html>
<html><head><meta charset="utf-8"><title>Zuffi</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  #pet { position: absolute; bottom: 0; left: 0; width: 92px; height: 168px; cursor: grab; will-change: transform; }
  #pet img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom; transform-origin: 50% 100%;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.28)); pointer-events: none; }
  #pet.idle img { animation: breathe 2.8s ease-in-out infinite; }
  #pet.left img { transform: scaleX(-1); }
  #pet.hop { animation: hop .42s cubic-bezier(.3,.7,.4,1); }
  #pet.hidden { display: none; }
  @keyframes breathe { 50% { transform: scaleY(1.03); } }
  @keyframes hop { 40% { margin-bottom: 24px; } }
  /* Website look: a dark pill that says it (buttons inside), then a white reply bubble */
  #card { position: absolute; bottom: 184px; left: 0; max-width: 360px; padding: 10px 10px 10px 14px; border-radius: 16px; color: #F5F5F5; background: #0C0C0C;
    box-shadow: 0 14px 34px rgba(12,12,12,.3); opacity: 0; transform: translateY(10px) scale(.9); transition: opacity .3s, transform .3s cubic-bezier(.34,1.56,.64,1); pointer-events: none;
    display: flex; align-items: center; gap: 10px; }
  #card.on { opacity: 1; transform: none; pointer-events: auto; }
  #card::after { content: ""; position: absolute; top: 100%; left: var(--tail, 40px); border: 7px solid transparent; border-top-color: #0C0C0C; }
  #card { z-index: 2; } .joy { z-index: 1; }
  #card.reply { bottom: 232px; background: #fff; color: #0C0C0C; padding-right: 14px; box-shadow: 0 14px 34px rgba(12,12,12,.22), 0 0 0 1px rgba(12,12,12,.12); }
  #card.reply::after { border-top-color: #fff; }
  #card .h { display: none; }
  #card .t { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  #card .b { display: flex; gap: 6px; flex: none; }
  #card button { font: inherit; font-size: 12.5px; font-weight: 700; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; color: rgba(255,255,255,.85); background: rgba(255,255,255,.12); transition: transform .15s, background .15s; }
  #card button.solid { color: #0C0C0C; background: #F5F5F5; }
  #card button.solid:active, #card button.solid.pressed { transform: scale(.9); background: #7EE2A8; }
  /* the happy dance: big hops with a wiggle, a squash on landing and a twirl */
  #pet.dance img { animation: dance 2.2s cubic-bezier(.3,.7,.4,1); }
  @keyframes dance {
    0% { transform: translateY(0) rotate(0) scale(1,1); }
    10% { transform: translateY(-40px) rotate(-10deg) scale(.96,1.05); } 20% { transform: translateY(0) rotate(0) scale(1.1,.9); }
    30% { transform: translateY(-38px) rotate(10deg) scale(.96,1.05); } 40% { transform: translateY(0) rotate(0) scale(1.1,.9); }
    52% { transform: translateY(-34px) rotateY(180deg); } 62% { transform: translateY(0) rotateY(360deg) scale(1.08,.92); }
    74% { transform: translateY(-26px) rotate(-8deg); } 84% { transform: translateY(0) rotate(0) scale(1.06,.94); }
    92% { transform: translateY(-10px) rotate(4deg); } 100% { transform: translateY(0) rotate(0) scale(1,1); } }
  .joy { position: absolute; font-size: 18px; pointer-events: none; animation: joy 1.4s ease-out forwards; }
  @keyframes joy { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -170px) scale(1.2); } }
</style></head>
<body><div id="card"><div class="h" id="cH"></div><div class="t" id="cT"></div><div class="b" id="cB"></div></div>
<div id="pet" class="idle"><img id="img" src="mascots/zuffi-body.webp" alt="Zuffi"></div>
<script src="pet.js"></script></body></html>
