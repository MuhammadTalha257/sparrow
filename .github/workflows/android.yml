name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore: ["mac/**", "windows/**", ".github/workflows/mac.yml", ".github/workflows/windows.yml", "README.md"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (pre-installed on GitHub runners)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Sparrow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sparrow-android
          path: Sparrow.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sparrow for Android
          make_latest: true
          files: Sparrow.apk
          body: |
            **Install Sparrow on Android**
            1. Download `Sparrow.apk` below on your Android phone.
            2. Open it. If asked, allow "Install unknown apps" for your browser.
            3. Open Sparrow 🐦
